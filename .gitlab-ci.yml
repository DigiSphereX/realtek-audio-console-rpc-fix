# GitLab CI - lightweight syntax/lint checks for a PowerShell project.
# The repair itself only runs on Windows; this pipeline validates the files.

stages:
  - validate

powershell-parse:
  stage: validate
  image: mcr.microsoft.com/powershell:latest
  script:
    - pwsh -NoProfile -File scripts/parse-check.ps1
  only:
    - main
    - merge_requests

name: parse-check

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  powershell-parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: ./scripts/parse-check.ps1
